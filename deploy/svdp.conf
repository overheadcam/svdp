# Manifest for "svdp" — plain PHP app (no build step), served by Apache.
# Modeled on svdp's own ~/svdp/deploy.sh: copy public/lib/apache/sql into place,
# leave config.php + public/uploads/ untouched. Adds a pre-deploy backup, a health
# check, and automatic restore-on-failure.
#
# Deploy from the Mac:  ship.sh svdp ~/Downloads/svdp-app.tar.gz

APP_TYPE=php
DOMAIN=svdp.thundrstruck.com
APP_HOME=/home/cruiserzen/svdp          # ship.sh uploads release.tar.gz here; backups/ live here

PHP_TARGET=/var/www/svdp-app            # app root (Apache serves its public/ subdir)
STRIP_COMPONENTS=1                      # tarball is rooted at svdp-app/ — drop that prefix
PHP_SYNC_DIRS="public lib apache sql"   # copy only these; preserves config.php + uploads/
PHP_OWNER=www-data:www-data
RELOAD_APACHE=1                         # plain PHP: no service, just reload Apache
SERVICE=""

HEALTH_URL=https://svdp.thundrstruck.com/
HEALTH_EXPECT=200,302,401

# Database: PostgreSQL 'svdp' on 127.0.0.1. backup.sh reads DATABASE_URL from the
# env file below (create ~/svdp/.env with the creds from config.php — see setup).
DB_KIND=postgres
DB_ENV_FILE=/home/cruiserzen/svdp/.env
KEEP_DB_DAYS=14

# Runtime tools this app needs (checked by ~/ops/healthcheck.sh "App dependencies"):
#   pdftotext, pdftoppm  -> poppler-utils  (PDF text + PDF->page images)
#   libreoffice          -> converts .doc/.docx/.ppt/.pptx/.xls/.xlsx to PDF so the
#                           Run of Show can show them inline as page images
DEPENDS="pdftotext pdftoppm libreoffice"
PHP_EXT="zip"         # reading .docx: agenda import, dispatcher reports, run-of-show
