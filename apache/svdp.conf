# =====================================================================
# Apache virtual host for the Vincentian Resource Center
# Ubuntu 20.04 · Apache2 · PHP (mod_php)
#
# Install to:  /etc/apache2/sites-available/svdp.conf
# Then:        sudo a2ensite svdp && sudo systemctl reload apache2
#
# Configured for:  svdp.thundrstruck.com
#
# IMPORTANT: DocumentRoot points at the "public/" subfolder so that
# config.php and the lib/ and sql/ folders are OUTSIDE the web root and
# can never be downloaded.
# =====================================================================

<VirtualHost *:80>
    ServerName svdp.thundrstruck.com

    DocumentRoot /var/www/svdp-app/public

    <Directory /var/www/svdp-app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Make sure the app root itself is never served directly.
    <Directory /var/www/svdp-app>
        Require all denied
    </Directory>
    <Directory /var/www/svdp-app/public>
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/svdp_error.log
    CustomLog ${APACHE_LOG_DIR}/svdp_access.log combined
</VirtualHost>

# After you run certbot (see SETUP.md), it will create a matching
# <VirtualHost *:443> block automatically and redirect HTTP to HTTPS.
